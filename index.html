<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adil Bin Harun</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&family=Tiro+Bangla&family=Amiri&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/vanilla-tilt/1.8.0/vanilla-tilt.min.js"></script>
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getFirestore, doc, getDoc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyALMbOClwa5JqO5sODqRaF5dBYxYh6lS_Y",
            authDomain: "adil-bin-harun.firebaseapp.com",
            projectId: "adil-bin-harun",
            storageBucket: "adil-bin-harun.firebasestorage.app",
            messagingSenderId: "640222460535",
            appId: "1:640222460535:web:72ec791d19f0b2df90e472",
            measurementId: "G-0S6MXW5YL7"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        const docRef = doc(db, "portfolio", "main_data");

        window.dbRef = { db, docRef };

        signInAnonymously(auth).then(() => {
            onSnapshot(docRef, (docSnap) => {
                if (docSnap.exists()) {
                    window.db = docSnap.data();
                    render();
                } else {
                    console.log("No data found, setting defaults");
                    window.db = DEFAULT_DB;
                    render();
                }
            });
        });
    </script>

    <style>
        :root { --accent: #00d4ff; --accent-glow: rgba(0, 212, 255, 0.4); --bg-deep: #020617; --glass: rgba(255, 255, 255, 0.03); --glass-border: rgba(0, 212, 255, 0.15); --text-main: #f8fafc; --card-bg: linear-gradient(145deg, rgba(15, 23, 42, 0.8) 0%, rgba(2, 6, 23, 0.9) 100%); --card-shadow: 0 40px 80px rgba(0,0,0,0.4); --transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
        [data-theme="light"] { --bg-deep: #f1f5f9; --text-main: #0f172a; --glass: rgba(15, 23, 42, 0.03); --glass-border: rgba(0, 212, 255, 0.2); --card-bg: #ffffff; --card-shadow: 0 10px 30px rgba(0,0,0,0.05); --accent: #0088cc; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: var(--bg-deep); color: var(--text-main); font-family: 'Poppins', sans-serif; transition: var(--transition); min-height: 100vh; }
        .scanline { width: 100%; height: 100px; z-index: 10; background: linear-gradient(0deg, transparent 0%, rgba(0, 212, 255, 0.05) 50%, transparent 100%); position: fixed; bottom: 100%; left: 0; pointer-events: none; animation: scan 8s linear infinite; }
        @keyframes scan { 0% { bottom: 100%; } 100% { bottom: -100px; } }
        .grid-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-image: linear-gradient(var(--glass-border) 1px, transparent 1px), linear-gradient(90deg, var(--glass-border) 1px, transparent 1px); background-size: 40px 40px; z-index: -1; opacity: 0.05; }
        .container { max-width: 600px; margin: 0 auto; padding: 100px 20px; position: relative; }
        .top-controls { position: fixed; top: 20px; left: 0; right: 0; padding: 0 20px; display: flex; justify-content: space-between; align-items: center; z-index: 1000; }
        .theme-toggle { background: var(--card-bg); backdrop-filter: blur(12px); border: 1px solid var(--glass-border); border-radius: 50%; width: 45px; height: 45px; display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--accent); }
        .lang-switcher { background: var(--card-bg); backdrop-filter: blur(12px); border: 1px solid var(--glass-border); border-radius: 20px; padding: 4px; display: flex; gap: 4px; }
        .lang-btn { padding: 6px 12px; border-radius: 15px; cursor: pointer; font-size: 10px; font-weight: 700; color: #64748b; }
        .lang-btn.active { background: var(--accent); color: #fff; }
        .profile-card { background: var(--card-bg); border: 1px solid var(--glass-border); border-radius: 40px; padding: 50px 20px; text-align: center; box-shadow: var(--card-shadow); }
        .pfp-ring { width: 140px; height: 140px; border-radius: 50%; margin: 0 auto 25px; padding: 5px; background: linear-gradient(45deg, var(--accent), #0072ff); }
        .pfp-img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; border: 4px solid var(--card-bg); }
        .section-label { display: flex; align-items: center; gap: 15px; margin: 40px 0 20px; font-size: 10px; text-transform: uppercase; letter-spacing: 3px; color: var(--accent); }
        .section-label::after { content: ''; flex: 1; height: 1px; background: linear-gradient(90deg, var(--glass-border), transparent); }
        .item-card { background: var(--glass); border: 1px solid var(--glass-border); border-radius: 24px; padding: 14px 20px; display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
        .icon-box { width: 45px; height: 45px; border-radius: 14px; background: var(--bg-deep); display: flex; align-items: center; justify-content: center; border: 1px solid var(--glass-border); color: var(--accent); }
        .btn-action { width: 38px; height: 38px; border-radius: 10px; border: 1px solid var(--glass-border); display: flex; align-items: center; justify-content: center; color: var(--accent); cursor: pointer; }
        #admin-modal { position: fixed; inset: 0; background: rgba(2, 6, 23, 0.98); z-index: 10001; display: none; justify-content: center; align-items: center; padding: 20px; }
        .admin-box { width: 100%; max-width: 550px; background: #0f172a; border: 1px solid var(--glass-border); border-radius: 32px; padding: 30px; max-height: 90vh; overflow-y: auto; color: white; }
        .admin-input { width: 100%; background: #020617; border: 1px solid #1e293b; padding: 12px 16px; border-radius: 12px; color: #fff; margin-bottom: 12px; }
        .btn-prime { background: var(--accent); color: #000; width: 100%; padding: 14px; border-radius: 12px; font-weight: 700; cursor: pointer; }
        #toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(100px); background: var(--accent); color: #000; padding: 10px 25px; border-radius: 50px; transition: 0.5s; z-index: 20002; }
        #toast.show { transform: translateX(-50%) translateY(0); }
    </style>
</head>
<body data-theme="dark">

    <div class="scanline"></div>
    <div class="grid-overlay"></div>

    <div class="top-controls">
        <div class="theme-toggle" onclick="toggleTheme()" id="theme-btn"><i class="fas fa-moon"></i></div>
        <div class="lang-switcher">
            <div class="lang-btn" id="btn-en" onclick="setLang('en')">EN</div>
            <div class="lang-btn" id="btn-bn" onclick="setLang('bn')">বাং</div>
            <div class="lang-btn" id="btn-ar" onclick="setLang('ar')">AR</div>
        </div>
    </div>

    <div class="container">
        <section class="profile-card">
            <div class="pfp-ring"><img src="" id="ui-img" class="pfp-img" alt="Profile"></div>
            <h1 class="text-3xl font-bold mb-2" id="ui-name">লোড হচ্ছে...</h1>
            <p class="text-xs tracking-[4px] uppercase text-cyan-400 font-semibold mb-4" id="ui-prof"></p>
            <div id="ui-quote" class="text-sm italic opacity-60 px-6 leading-relaxed"></div>
        </section>
        <div class="section-label" id="label-soc">Social Networks</div>
        <div id="social-grid"></div>
        <div class="section-label" id="label-con">Contacts</div>
        <div id="contact-grid"></div>
        <footer class="mt-20 pb-10 text-center opacity-30 text-[9px] tracking-[5px]" id="ui-footer"></footer>
    </div>

    <!-- Admin Panel -->
    <div id="admin-modal">
        <div class="admin-box" id="login-panel">
            <h2 class="font-bold text-center mb-6">Admin Access</h2>
            <input type="password" id="adm-pass" class="admin-input" placeholder="প্রবেশ কি">
            <button class="btn-prime" onclick="login()">প্রবেশ করুন</button>
        </div>
        <div class="admin-box" id="dash-panel" style="display:none;">
            <div id="adm-profile"></div>
            <button class="btn-prime" onclick="save()">সব সংরক্ষণ করুন</button>
            <button class="btn-prime mt-2" style="background:#444" onclick="closeAdmin()">বন্ধ করুন</button>
        </div>
    </div>

    <div id="toast"></div>

    <script>
        const DEFAULT_DB = {
            profile: { img: "", name: { en: "Adil Harun", bn: "আদিল হারুন", ar: "عادل هارون" }, prof: { en: "Developer", bn: "ডেভেলপার", ar: "مطور" }, quote: { en: "Keep coding.", bn: "কোডিং চালিয়ে যান।", ar: "استمر في البرمجة" }, footer: "© ELITE" },
            socials: [], contacts: []
        };
        let lang = 'bn';
        let theme = 'dark';

        function applyTheme() {
            document.body.setAttribute('data-theme', theme);
        }

        function toggleTheme() { theme = theme === 'dark' ? 'light' : 'dark'; applyTheme(); }
        
        function setLang(l) {
            lang = l;
            document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('btn-' + l).classList.add('active');
            render();
        }

        function render() {
            if (!window.db) return;
            const p = window.db.profile;
            document.getElementById('ui-img').src = p.img || "";
            document.getElementById('ui-name').innerText = p.name[lang] || p.name.en;
            document.getElementById('ui-prof').innerText = p.prof[lang] || p.prof.en;
            document.getElementById('ui-quote').innerText = p.quote[lang] || p.quote.en;
            document.getElementById('ui-footer').innerText = p.footer;
            // ... (Rest of rendering logic remains the same)
        }

        function login() {
            if(document.getElementById('adm-pass').value === 'Adil@2005') {
                document.getElementById('login-panel').style.display = 'none';
                document.getElementById('dash-panel').style.display = 'block';
            } else { msg("ভুল পাসওয়ার্ড!"); }
        }

        async function save() {
            const { setDoc, doc } = await import("https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js");
            await setDoc(window.dbRef.docRef, window.db);
            msg("সফলভাবে সেভ হয়েছে");
            closeAdmin();
        }

        function closeAdmin() { document.getElementById('admin-modal').style.display = 'none'; }
        function msg(m) { const t = document.getElementById('toast'); t.innerText = m; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 2000); }

        window.onload = () => { applyTheme(); setLang('bn'); };
    </script>
</body>
</html>
