<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adil Bin Harun</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&family=Tiro+Bangla&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/vanilla-tilt/1.8.0/vanilla-tilt.min.js"></script>
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        :root {
            --accent: #00d4ff; 
            --accent-glow: rgba(0, 212, 255, 0.4);
            --bg-deep: #020617; 
            --card-bg: linear-gradient(145deg, rgba(15, 23, 42, 0.8) 0%, rgba(2, 6, 23, 0.9) 100%);
            --glass: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(0, 212, 255, 0.15);
            --text-main: #f8fafc;
            --text-dim: #94a3b8;
            --icon-bg: #0f172a;
        }

        [data-theme="light"] {
            --bg-deep: #f1f5f9;
            --card-bg: linear-gradient(145deg, #ffffff 0%, #e2e8f0 100%);
            --glass: rgba(0, 212, 255, 0.05);
            --glass-border: rgba(0, 114, 255, 0.2);
            --text-main: #0f172a;
            --text-dim: #475569;
            --icon-bg: #ffffff;
            --accent: #0072ff;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body {
            background: var(--bg-deep);
            color: var(--text-main);
            font-family: 'Poppins', 'Tiro Bangla', sans-serif;
            overflow-x: hidden;
            min-height: 100vh;
            transition: background 0.5s ease, color 0.5s ease;
        }

        .grid-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-image: linear-gradient(var(--glass-border) 1px, transparent 1px), linear-gradient(90deg, var(--glass-border) 1px, transparent 1px);
            background-size: 40px 40px; z-index: -1; opacity: 0.05;
        }

        .controls-container {
            position: fixed; top: 20px; right: 20px; z-index: 1000;
            display: flex; gap: 10px; align-items: center;
        }

        .control-btn {
            background: rgba(var(--icon-bg), 0.8); backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border); border-radius: 15px;
            padding: 10px; cursor: pointer; color: var(--accent);
            box-shadow: 0 4px 15px rgba(0,0,0,0.1); transition: 0.3s;
        }
        .control-btn:hover { transform: scale(1.1); box-shadow: 0 0 15px var(--accent-glow); }

        .lang-switcher {
            background: rgba(var(--icon-bg), 0.8); backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border); border-radius: 20px;
            padding: 4px; display: flex; gap: 4px;
        }
        .lang-btn {
            padding: 6px 10px; border-radius: 15px; cursor: pointer;
            font-size: 10px; font-weight: 700; transition: 0.3s; color: var(--text-dim);
        }
        .lang-btn.active { background: var(--accent); color: #fff; box-shadow: 0 0 10px var(--accent-glow); }

        .container { width: 100%; max-width: 600px; margin: 0 auto; padding: 100px 20px 50px; }

        .profile-card {
            background: var(--card-bg);
            backdrop-filter: blur(20px); border: 1px solid var(--glass-border);
            border-radius: 40px; padding: 50px 20px 40px; text-align: center;
            box-shadow: 0 20px 50px rgba(0,0,0,0.1);
        }

        .pfp-ring {
            width: 140px; height: 140px; border-radius: 50%; margin: 0 auto 25px;
            padding: 4px; background: linear-gradient(45deg, var(--accent), #6366f1);
            box-shadow: 0 0 25px var(--accent-glow);
        }
        .pfp-img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; border: 4px solid var(--bg-deep); }

        .section-label { 
            display: flex; align-items: center; gap: 15px; margin: 40px 0 20px; 
            font-size: 11px; text-transform: uppercase; letter-spacing: 2px; color: var(--accent); font-weight: bold;
        }
        .section-label::after { content: ''; flex: 1; height: 1px; background: linear-gradient(90deg, var(--glass-border), transparent); }

        .item-card {
            background: var(--glass); border: 1px solid var(--glass-border);
            border-radius: 24px; padding: 15px 20px; display: flex; align-items: center;
            justify-content: space-between; transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            margin-bottom: 12px;
        }
        .item-card:hover { border-color: var(--accent); background: rgba(0, 212, 255, 0.08); transform: translateY(-3px); }

        .icon-box {
            width: 45px; height: 45px; border-radius: 14px; background: var(--icon-bg);
            display: flex; align-items: center; justify-content: center;
            border: 1px solid var(--glass-border); font-size: 1.2rem; color: var(--accent);
        }

        .btn-action {
            width: 40px; height: 40px; border-radius: 12px; border: 1px solid var(--glass-border);
            display: flex; align-items: center; justify-content: center; color: var(--accent);
            cursor: pointer; transition: 0.3s; background: var(--icon-bg);
        }
        .btn-action:hover { background: var(--accent); color: #fff; transform: scale(1.1); }

        #cursor-glow {
            position: fixed; width: 250px; height: 250px;
            background: radial-gradient(circle, var(--accent-glow) 0%, transparent 70%);
            border-radius: 50%; pointer-events: none; z-index: 99999;
            transform: translate(-50%, -50%); transition: transform 0.1s ease-out;
            display: none;
        }
        @media (min-width: 1024px) { #cursor-glow { display: block; } }

        #admin-modal {
            position: fixed; inset: 0; background: rgba(0, 0, 0, 0.9);
            z-index: 10001; display: none; justify-content: center; align-items: center; padding: 20px;
        }
        .admin-box {
            width: 100%; max-width: 500px; background: var(--bg-deep); border: 1px solid var(--glass-border);
            border-radius: 30px; padding: 30px; max-height: 90vh; overflow-y: auto; color: var(--text-main);
        }
        .admin-input {
            width: 100%; background: var(--glass); border: 1px solid var(--glass-border); padding: 12px;
            border-radius: 15px; color: var(--text-main); margin-bottom: 12px; font-size: 0.85rem;
        }

        #toast {
            position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(100px);
            background: var(--accent); color: #fff; padding: 12px 30px; border-radius: 50px;
            font-weight: 700; z-index: 20002; transition: 0.5s; font-size: 0.8rem;
        }
        #toast.show { transform: translateX(-50%) translateY(0); }
    </style>
</head>
<body data-theme="dark">

    <div id="cursor-glow"></div>
    <div class="grid-overlay"></div>

    <div class="controls-container" data-aos="fade-down">
        <!-- Theme Toggle -->
        <div class="control-btn" onclick="toggleTheme()" title="Change Theme">
            <i id="theme-icon" class="fas fa-moon"></i>
        </div>
        <!-- Language Switcher -->
        <div class="lang-switcher">
            <div class="lang-btn" id="btn-en" onclick="setLang('en')">EN</div>
            <div class="lang-btn" id="btn-bn" onclick="setLang('bn')">বাং</div>
            <div class="lang-btn" id="btn-ar" onclick="setLang('ar')">AR</div>
        </div>
    </div>

    <div class="container">
        <section class="profile-card" data-aos="zoom-in">
            <div class="pfp-ring" data-tilt>
                <img src="" id="ui-img" class="pfp-img" alt="Avatar">
            </div>
            <h1 class="text-2xl md:text-3xl font-bold mb-2" id="ui-name"></h1>
            <p class="text-[10px] tracking-[4px] uppercase text-cyan-400 font-bold" id="ui-prof"></p>
            <div id="ui-quote" class="mt-6 text-sm italic opacity-70 px-6 leading-relaxed"></div>
        </section>

        <div class="section-label" id="label-soc">Social Networks</div>
        <div id="social-grid"></div>

        <div class="section-label" id="label-con">Contact Channels</div>
        <div id="contact-grid"></div>

        <footer class="mt-20 pb-10 text-center opacity-30 text-[9px] tracking-[5px]" id="ui-footer"></footer>
    </div>

    <div id="admin-modal">
        <div class="admin-box" id="login-panel">
            <div class="text-center mb-8">
                <i class="fas fa-fingerprint text-4xl text-cyan-400 mb-4"></i>
                <h2 class="text-lg font-bold tracking-widest uppercase">Security Gate</h2>
            </div>
            <input type="password" id="adm-pass" class="admin-input text-center" placeholder="ACCESS PIN">
            <button class="w-full bg-cyan-500 text-white py-3 rounded-xl font-bold mb-2" onclick="login()">Enter System</button>
            <button class="w-full bg-slate-800 text-white py-3 rounded-xl font-bold" onclick="closeAdmin()">Cancel</button>
        </div>

        <div class="admin-box" id="dash-panel" style="display:none;">
            <div class="flex gap-2 mb-6 bg-black/20 p-1.5 rounded-2xl">
                <button onclick="showTab('profile')" class="flex-1 py-2 rounded-xl text-[10px] font-bold hover:bg-cyan-500 transition">INFO</button>
                <button onclick="showTab('socials')" class="flex-1 py-2 rounded-xl text-[10px] font-bold hover:bg-cyan-500 transition">SOC</button>
                <button onclick="showTab('contacts')" class="flex-1 py-2 rounded-xl text-[10px] font-bold hover:bg-cyan-500 transition">CON</button>
            </div>

            <!-- Profile Info Edit -->
            <div id="adm-profile" class="adm-tab">
                <input type="text" id="in-img" class="admin-input" placeholder="Avatar URL">
                <div class="grid grid-cols-1 md:grid-cols-3 gap-2">
                    <input type="text" id="in-name-en" class="admin-input" placeholder="Name EN">
                    <input type="text" id="in-name-bn" class="admin-input" placeholder="নাম BN">
                    <input type="text" id="in-name-ar" class="admin-input" placeholder="اسم AR">
                </div>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-2">
                    <input type="text" id="in-prof-en" class="admin-input" placeholder="Role EN">
                    <input type="text" id="in-prof-bn" class="admin-input" placeholder="পেশা BN">
                    <input type="text" id="in-prof-ar" class="admin-input" placeholder="دور AR">
                </div>
                <textarea id="in-quote-en" class="admin-input" placeholder="Quote EN"></textarea>
                <textarea id="in-quote-bn" class="admin-input" placeholder="উক্তি BN"></textarea>
                <textarea id="in-quote-ar" class="admin-input" placeholder="اقتباس AR"></textarea>
                <input type="text" id="in-footer" class="admin-input" placeholder="Footer Text">
            </div>

            <!-- Socials Edit -->
            <div id="adm-socials" class="adm-tab" style="display:none;">
                <div class="bg-black/30 p-4 rounded-2xl border border-white/5 mb-4">
                    <p class="text-[9px] text-cyan-400 mb-2 font-bold" id="soc-title">NEW SOCIAL</p>
                    <input type="text" id="in-soc-en" class="admin-input" placeholder="Name EN (e.g. YouTube)">
                    <input type="text" id="in-soc-bn" class="admin-input" placeholder="নাম BN">
                    <input type="text" id="in-soc-ar" class="admin-input" placeholder="اسم AR">
                    <input type="text" id="in-soc-link" class="admin-input" placeholder="URL (https://...)">
                    <button class="w-full bg-cyan-500 py-2 rounded-lg font-bold" onclick="saveSocial()">Save Social</button>
                </div>
                <div id="adm-soc-list" class="space-y-2"></div>
            </div>

            <!-- Contacts Edit -->
            <div id="adm-contacts" class="adm-tab" style="display:none;">
                <div class="bg-black/30 p-4 rounded-2xl border border-white/5 mb-4">
                    <p class="text-[9px] text-cyan-400 mb-2 font-bold" id="con-title">NEW CONTACT</p>
                    <input type="text" id="in-con-en" class="admin-input" placeholder="Type EN (e.g. WhatsApp)">
                    <input type="text" id="in-con-bn" class="admin-input" placeholder="BN">
                    <input type="text" id="in-con-ar" class="admin-input" placeholder="AR">
                    <input type="text" id="in-con-val" class="admin-input" placeholder="Value (Phone/Email)">
                    <button class="w-full bg-cyan-500 py-2 rounded-lg font-bold" onclick="saveContact()">Save Contact</button>
                </div>
                <div id="adm-con-list" class="space-y-2"></div>
            </div>

            <div class="flex gap-2 mt-6">
                <button class="flex-1 bg-green-500 text-white py-3 rounded-xl font-bold" onclick="saveToDisk()">Apply</button>
                <button class="flex-1 bg-slate-700 text-white py-3 rounded-xl font-bold" onclick="closeAdmin()">Exit</button>
            </div>
        </div>
    </div>

    <div id="toast">SYSTEM UPDATED</div>

    <script>
        const DEFAULT_DB = {
            profile: {
                img: "https://api.dicebear.com/7.x/avataaars/svg?seed=Adil",
                name: { en: "Adil Bin Harun", bn: "আদিল বিন হারুন", ar: "عادل بن هارون" },
                prof: { en: "Tech Architect", bn: "টেক আর্কিটেক্ট", ar: "مهندس تقني" },
                quote: { en: "Designing future-proof digital experiences.", bn: "ভবিষ্যৎমুখী ডিজিটাল অভিজ্ঞতা তৈরি করছি।", ar: "تصميم تجارب رقمية مستقبلية." },
                footer: "SAPPHIRE CORE • SECURE v12.0"
            },
            socials: [
                { id: 1, name: {en: "LinkedIn", bn: "লিঙ্কডইন", ar: "لينكد إن"}, link: "https://linkedin.com" },
                { id: 2, name: {en: "YouTube", bn: "ইউটিউব", ar: "يوتيوب"}, link: "https://youtube.com" }
            ],
            contacts: [
                { id: 1, label: {en: "WhatsApp", bn: "হোয়াটসঅ্যাপ", ar: "واتساب"}, val: "+880123456789" },
                { id: 2, label: {en: "Email", bn: "ইমেইল", ar: "بريد"}, val: "adil@example.com" }
            ]
        };

        let db = JSON.parse(localStorage.getItem('sapphire_pro_v12')) || DEFAULT_DB;
        let lang = localStorage.getItem('app_lang') || 'en';
        let theme = localStorage.getItem('app_theme') || 'dark';
        let editSocIdx = -1;
        let editConIdx = -1;

        function getIcon(name) {
            const n = name.toLowerCase();
            if(n.includes('facebook')) return 'fab fa-facebook';
            if(n.includes('youtube')) return 'fab fa-youtube';
            if(n.includes('linkedin')) return 'fab fa-linkedin';
            if(n.includes('github')) return 'fab fa-github';
            if(n.includes('whatsapp')) return 'fab fa-whatsapp';
            if(n.includes('telegram')) return 'fab fa-telegram';
            if(n.includes('twitter') || n.includes('x')) return 'fab fa-x-twitter';
            if(n.includes('viber')) return 'fab fa-viber';
            if(n.includes('instagram')) return 'fab fa-instagram';
            if(n.includes('email') || n.includes('gmail')) return 'fas fa-envelope';
            if(n.includes('phone') || n.includes('call')) return 'fas fa-phone';
            return 'fas fa-link';
        }

        function toggleTheme() {
            theme = theme === 'dark' ? 'light' : 'dark';
            document.body.setAttribute('data-theme', theme);
            localStorage.setItem('app_theme', theme);
            document.getElementById('theme-icon').className = theme === 'dark' ? 'fas fa-moon' : 'fas fa-sun';
            msg(theme.toUpperCase() + " MODE ACTIVE");
        }

        function setLang(l) {
            lang = l;
            localStorage.setItem('app_lang', l);
            document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('btn-' + l).classList.add('active');
            render();
        }

        function render() {
            const p = db.profile;
            const l = lang;
            
            document.getElementById('ui-img').src = p.img;
            document.getElementById('ui-name').innerText = p.name[l] || p.name.en;
            document.getElementById('ui-prof').innerText = p.prof[l] || p.prof.en;
            document.getElementById('ui-quote').innerText = p.quote[l] || p.quote.en;
            document.getElementById('ui-footer').innerText = p.footer;

            const labels = {
                en: { soc: "Social Networks", con: "Contacts" },
                bn: { soc: "সোশ্যাল মাধ্যম", con: "যোগাযোগ" },
                ar: { soc: "شبكات اجتماعية", con: "اتصال" }
            };
            document.getElementById('label-soc').innerText = labels[l].soc;
            document.getElementById('label-con').innerText = labels[l].con;

            // Render Socials
            document.getElementById('social-grid').innerHTML = db.socials.map(s => `
                <div class="item-card" data-aos="fade-up">
                    <div class="flex items-center gap-4">
                        <div class="icon-box"><i class="${getIcon(s.name.en)}"></i></div>
                        <div class="text-left">
                            <p class="font-bold text-sm">${s.name[l] || s.name.en}</p>
                            <p class="text-[8px] opacity-40 uppercase">${s.name.en}</p>
                        </div>
                    </div>
                    <div class="flex gap-2">
                        <a href="${s.link}" target="_blank" class="btn-action"><i class="fas fa-external-link-alt"></i></a>
                        <div class="btn-action" onclick="copy('${s.link}')"><i class="far fa-copy"></i></div>
                    </div>
                </div>
            `).join('');

            // Render Contacts with Smart Buttons
            document.getElementById('contact-grid').innerHTML = db.contacts.map(c => {
                let link = "";
                let icon = "fas fa-paper-plane";
                let actText = "Send";
                const v = c.val.toLowerCase();
                const lbl = c.label.en.toLowerCase();

                if(v.includes('@')) { link = `mailto:${c.val}`; icon = "fas fa-paper-plane"; actText="Mail"; }
                else if(lbl.includes('whatsapp')) { link = `https://wa.me/${c.val.replace(/\D/g,'')}`; icon = "fas fa-paper-plane"; actText="Chat"; }
                else if(lbl.includes('phone') || lbl.includes('call') || /^\+?\d+$/.test(v.replace(/\s/g,''))) { link = `tel:${c.val}`; icon = "fas fa-phone"; actText="Call"; }
                else { link = v.startsWith('http') ? v : `https://${v}`; }

                return `
                <div class="item-card" data-aos="fade-up">
                    <div class="flex items-center gap-4">
                        <div class="icon-box"><i class="${getIcon(c.label.en)}"></i></div>
                        <div class="text-left">
                            <p class="font-bold text-sm">${c.label[l] || c.label.en}</p>
                            <p class="text-[8px] opacity-40 uppercase">${actText}</p>
                        </div>
                    </div>
                    <div class="flex gap-2">
                        <a href="${link}" target="_blank" class="btn-action" title="${actText}"><i class="${icon}"></i></a>
                        <div class="btn-action" onclick="copy('${c.val}')" title="Copy"><i class="far fa-copy"></i></div>
                    </div>
                </div>
            `}).join('');

            renderAdminLists();
        }

        function login() {
            if(document.getElementById('adm-pass').value === 'Adil@2005') {
                document.getElementById('login-panel').style.display = 'none';
                document.getElementById('dash-panel').style.display = 'block';
                syncInputs();
            } else { msg("AUTH FAILED"); }
        }

        function syncInputs() {
            document.getElementById('in-img').value = db.profile.img;
            document.getElementById('in-name-en').value = db.profile.name.en;
            document.getElementById('in-name-bn').value = db.profile.name.bn || "";
            document.getElementById('in-name-ar').value = db.profile.name.ar || "";
            document.getElementById('in-prof-en').value = db.profile.prof.en;
            document.getElementById('in-prof-bn').value = db.profile.prof.bn || "";
            document.getElementById('in-prof-ar').value = db.profile.prof.ar || "";
            document.getElementById('in-quote-en').value = db.profile.quote.en;
            document.getElementById('in-quote-bn').value = db.profile.quote.bn || "";
            document.getElementById('in-quote-ar').value = db.profile.quote.ar || "";
            document.getElementById('in-footer').value = db.profile.footer;
        }

        function saveSocial() {
            const en = document.getElementById('in-soc-en').value;
            const bn = document.getElementById('in-soc-bn').value;
            const ar = document.getElementById('in-soc-ar').value;
            const link = document.getElementById('in-soc-link').value;
            if(!en || !link) return;
            const item = { id: Date.now(), name: {en, bn, ar}, link };
            if(editSocIdx === -1) db.socials.push(item); else db.socials[editSocIdx] = item;
            editSocIdx = -1; document.querySelectorAll('#adm-socials input').forEach(i=>i.value='');
            renderAdminLists(); msg("Social Saved");
        }

        function saveContact() {
            const en = document.getElementById('in-con-en').value;
            const bn = document.getElementById('in-con-bn').value;
            const ar = document.getElementById('in-con-ar').value;
            const val = document.getElementById('in-con-val').value;
            if(!en || !val) return;
            const item = { id: Date.now(), label: {en, bn, ar}, val };
            if(editConIdx === -1) db.contacts.push(item); else db.contacts[editConIdx] = item;
            editConIdx = -1; document.querySelectorAll('#adm-contacts input').forEach(i=>i.value='');
            renderAdminLists(); msg("Contact Saved");
        }

        function renderAdminLists() {
            document.getElementById('adm-soc-list').innerHTML = db.socials.map((s, i) => `
                <div class="flex justify-between p-2 bg-white/5 rounded-lg text-[10px]">
                    <span>${s.name.en}</span>
                    <div class="flex gap-2">
                        <button onclick="editSocial(${i})" class="text-blue-400">EDIT</button>
                        <button onclick="delSocial(${i})" class="text-red-400">DEL</button>
                    </div>
                </div>
            `).join('');
            document.getElementById('adm-con-list').innerHTML = db.contacts.map((c, i) => `
                <div class="flex justify-between p-2 bg-white/5 rounded-lg text-[10px]">
                    <span>${c.label.en}</span>
                    <div class="flex gap-2">
                        <button onclick="editContact(${i})" class="text-blue-400">EDIT</button>
                        <button onclick="delContact(${i})" class="text-red-400">DEL</button>
                    </div>
                </div>
            `).join('');
        }

        function editSocial(i) {
            editSocIdx = i; const s = db.socials[i];
            document.getElementById('in-soc-en').value = s.name.en;
            document.getElementById('in-soc-bn').value = s.name.bn;
            document.getElementById('in-soc-ar').value = s.name.ar;
            document.getElementById('in-soc-link').value = s.link;
        }

        function editContact(i) {
            editConIdx = i; const c = db.contacts[i];
            document.getElementById('in-con-en').value = c.label.en;
            document.getElementById('in-con-bn').value = c.label.bn;
            document.getElementById('in-con-ar').value = c.label.ar;
            document.getElementById('in-con-val').value = c.val;
        }

        function delSocial(i) { db.socials.splice(i,1); renderAdminLists(); }
        function delContact(i) { db.contacts.splice(i,1); renderAdminLists(); }

        function saveToDisk() {
            db.profile.img = document.getElementById('in-img').value;
            db.profile.name = { en: document.getElementById('in-name-en').value, bn: document.getElementById('in-name-bn').value, ar: document.getElementById('in-name-ar').value };
            db.profile.prof = { en: document.getElementById('in-prof-en').value, bn: document.getElementById('in-prof-bn').value, ar: document.getElementById('in-prof-ar').value };
            db.profile.quote = { en: document.getElementById('in-quote-en').value, bn: document.getElementById('in-quote-bn').value, ar: document.getElementById('in-quote-ar').value };
            db.profile.footer = document.getElementById('in-footer').value;
            localStorage.setItem('sapphire_pro_v12', JSON.stringify(db));
            render(); msg("Profile Updated"); closeAdmin();
        }

        function closeAdmin() {
            document.getElementById('admin-modal').style.display = 'none';
            document.getElementById('dash-panel').style.display = 'none';
            document.getElementById('login-panel').style.display = 'block';
            document.getElementById('adm-pass').value = '';
        }

        function showTab(t) {
            document.querySelectorAll('.adm-tab').forEach(x => x.style.display = 'none');
            document.getElementById('adm-' + t).style.display = 'block';
        }

        function copy(txt) {
            const el = document.createElement('textarea'); el.value = txt; document.body.appendChild(el); el.select();
            document.execCommand('copy'); document.body.removeChild(el); msg("Copied!");
        }

        function msg(m) {
            const t = document.getElementById('toast'); t.innerText = m; t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 2000);
        }

        const glow = document.getElementById('cursor-glow');
        document.addEventListener('mousemove', e => {
            glow.style.left = e.clientX + 'px';
            glow.style.top = e.clientY + 'px';
        });

        let pressTimer;
        const start = () => pressTimer = setTimeout(() => {
            document.getElementById('admin-modal').style.display = 'flex';
        }, 2500);
        const stop = () => clearTimeout(pressTimer);
        document.addEventListener('mousedown', start); document.addEventListener('touchstart', start);
        document.addEventListener('mouseup', stop); document.addEventListener('touchend', stop);

        window.onload = () => { 
            AOS.init({ duration: 800 }); 
            document.body.setAttribute('data-theme', theme);
            document.getElementById('theme-icon').className = theme === 'dark' ? 'fas fa-moon' : 'fas fa-sun';
            setLang(lang); 
        };
    </script>
</body>
</html>
